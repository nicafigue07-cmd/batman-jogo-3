name: Testar FORGE IA 3D PRO no navegador
on:
  push:
    branches: [kaito-nami-jogavel]
    paths:
      - 'forge-ia-3d/**'
      - 'tests/forge-smoke.mjs'
      - 'tests/forge-objectives.mjs'
      - 'tests/forge-graphics.mjs'
      - 'tests/forge-campaign.mjs'
      - 'tests/forge-chat.mjs'
      - '.github/workflows/testar-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/forge-backend.mjs
      - run: node tests/forge-smoke.mjs
      - run: node tests/forge-objectives.mjs
      - run: node tests/forge-graphics.mjs
      - run: node tests/forge-campaign.mjs
      - run: node tests/forge-chat.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
