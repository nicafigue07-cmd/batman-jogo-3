name: Testar FORGE IA 3D PRO no navegador
on:
  push:
    branches: [kaito-nami-jogavel]
    paths:
      - 'forge-ia-3d/**'
      - 'tests/forge-smoke.mjs'
      - '.github/workflows/testar-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/forge-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
